[package]
name = "topmost-pin"
version = "1.0.0"
description = "窗口置顶助手 - 便携版任意窗口置顶工具"
authors = ["liyuanhao"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "topmost_pin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 只启用 tray-icon。切勿启用 image-png / image-ico：它们依赖 `image` crate，
# 而该 crate 不在本机离线缓存中。托盘图标改用 app.default_window_icon()。
tauri = { version = "2", features = ["tray-icon"] }

# 刻意**不用** tauri-plugin-single-instance：它的互斥体在 Builder 阶段就会把第二个实例
# 顶掉，而「切换管理员权限」需要在运行时重启进程 —— 旧实例尚未退出时，新实例会被误判为
# 重复启动而自杀。改为自实现（见 src/single_instance.rs），既解决竞态，也顺带甩掉
# 它依赖链上 Linux 专用的 zbus / async-broadcast（那两个不在离线缓存里）。

# 开机自启刻意不用 tauri-plugin-autostart：它依赖 auto-launch -> async-broadcast，
# 而 async-broadcast 不在本机离线缓存中，离线解析会直接失败。
# 改用 winreg 直接写 HKCU\Software\Microsoft\Windows\CurrentVersion\Run。
winreg = "0.55"

# SQLite 数据层。bundled 会把 sqlite3.c 一起编译进来，不依赖系统库，
# 与「便携、零外部依赖」的定位一致。本机 VS2022 提供 MSVC，可离线编译。
rusqlite = { version = "0.40", features = ["bundled"] }

# Win32 直调。本机 cargo 无法联网，只能用已缓存且已在既有项目 Cargo.lock 中解析过的版本。
#
# ★ 必须写成内联表：若写成 [dependencies.windows-sys] 子表，TOML 会把后续所有
#   依赖项都归入该子表，serde / dirs 等将不再生效（这个坑已经踩过一次）。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # ShellExecuteW（提权/降权重启）、IsUserAnAdmin
    "Win32_UI_Shell",
    # GetTokenInformation + TOKEN_ELEVATION（判断当前是否管理员）
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_LibraryLoader",
] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
parking_lot = "0.12"

[features]
# ★ 生产构建必须启用本 feature，否则 Tauri 会判定为开发模式。
#
# 机制：tauri/build.rs 里 `let dev = !custom_protocol;`，而 tauri-codegen 在
# `dev && dev_url.is_some()` 时把窗口指向 devUrl（http://localhost:1420）。
# 结果就是「窗口能开、但显示 localhost 拒绝连接」，内嵌资源根本没用上。
#
# `tauri build` 会自动带上它；直接跑 `cargo build --release` 时必须手动
# 传 `--features custom-protocol`。
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# 说明：这里刻意不使用 codegen-units = 1 / lto = "fat"。
# 那会把整个 crate 合成一个 40MB+ 的目标文件，在本机（带实时防病毒扫描）上
# 会导致 rustc 写入后立即删除该文件时被占用而报 os error 32。
# thin LTO + 默认 codegen-units 体积几乎相当，但构建稳定得多。
lto = "thin"
codegen-units = 16
opt-level = "s"
strip = true

# ★ bundled 的 sqlite3.c 必须关掉调试信息。
#
# 原因：dev / test profile 默认 debug = true，cc-rs 会据此给 C 编译器加 `-Z7`，
# 而 sqlite3.c 有 8MB 之巨，本机 MSVC 直接失败：
#     cl : Command line error D8050 : cannot execute 'c1.dll':
#          failed to get command line into debug records
# release profile 本来就没有调试信息，所以只有 dev 会踩到 —— 这个坑很隐蔽：
# `cargo build --release` 一路正常，`cargo test` 却编不过。
# C 代码也不需要 Rust 侧的调试信息，关掉即可。
[profile.dev.package.libsqlite3-sys]
debug = false

[profile.test.package.libsqlite3-sys]
debug = false
